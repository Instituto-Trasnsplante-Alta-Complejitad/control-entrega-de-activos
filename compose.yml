services:
  migrate:
    image: control-entrega-activos:0.1.0
    container_name: control-entrega-activos-migrate
    command: ["node", "./node_modules/prisma/build/index.js", "migrate", "deploy"]
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: control_entrega_activos
      DATABASE_USER: control_activos_migrator
      DATABASE_PASSWORD_FILE: /run/secrets/db_migrator_password
    secrets:
      - db_migrator_password
    networks:
      - db-internal
    restart: "no"

  app:
    image: control-entrega-activos:0.1.0
    container_name: control-entrega-activos
    environment:
      NODE_ENV: production
      PORT: "8080"
      APP_URL: https://apps.ad.itac.com.ar/activos
      APP_BASE_PATH: /activos
      KEYCLOAK_ISSUER: https://apps.ad.itac.com.ar/auth/realms/itac
      APP_ADMIN_GROUP: /ARR-ITAC-IT
      APP_ADMIN_ROLE: control-activos-admin
      APP_ALLOWED_GROUPS: /ARR-ITAC-IT
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: control_entrega_activos
      DATABASE_USER: control_activos_app
      DATABASE_PASSWORD_FILE: /run/secrets/db_app_password
      STORAGE_PATH: /data/control-entrega-activos
      TZ: America/Argentina/Buenos_Aires
      OCS_BASE_URL: http://inventario.ad.itac.com.ar/ocsapi/v1
      OCS_WARNING_HOURS: "24"
      OCS_CRITICAL_DAYS: "7"
      OCS_REPORT_DAYS: "30"
      OCS_TIMEOUT_MS: "20000"
      OCS_CONCURRENCY: "6"
      OCS_CREATE_MISSING: "false"
      OCS_AUTO_SYNC: "true"
      OCS_SYNC_INTERVAL_HOURS: "24"
      OCS_RETRY_INTERVAL_MINUTES: "60"
      MIN_RAM_GB: "8"
      CRITICAL_RAM_GB: "4"
      RENEWAL_MIN_SCORE: "3"
      OLD_OS_PATTERNS: "windows xp,windows vista,windows 7,windows 8"
    secrets:
      - db_app_password
    volumes:
      - type: bind
        source: /srv/docker/apps/control-entrega-activos/data
        target: /data/control-entrega-activos
    networks:
      - app-internal
      - db-internal
      - ocs-egress
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  auth:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    container_name: control-entrega-activos-auth
    command:
      - --http-address=0.0.0.0:4180
      - --provider=keycloak-oidc
      - --provider-display-name=ITAC
      - --client-id=control-entrega-activos
      - --client-secret-file=/run/secrets/keycloak_client_secret
      - --cookie-secret-file=/run/secrets/oauth_cookie_secret
      - --cookie-name=__Secure-control_entrega_activos
      - --cookie-secure=true
      - --cookie-httponly=true
      - --cookie-samesite=lax
      - --cookie-path=/activos
      - --proxy-prefix=/activos/oauth2
      - --redirect-url=https://apps.ad.itac.com.ar/activos/oauth2/callback
      - --oidc-issuer-url=https://apps.ad.itac.com.ar/auth/realms/itac
      - --insecure-oidc-allow-unverified-email=true
      - --skip-oidc-discovery=true
      - --login-url=https://apps.ad.itac.com.ar/auth/realms/itac/protocol/openid-connect/auth
      - --redeem-url=http://keycloak:8080/auth/realms/itac/protocol/openid-connect/token
      - --oidc-jwks-url=http://keycloak:8080/auth/realms/itac/protocol/openid-connect/certs
      - --oidc-groups-claim=groups
      - --provider-ca-file=/etc/ssl/certs/ad-ITAC-CA.pem
      - --use-system-trust-store=true
      - --email-domain=itac.com.ar
      - --scope=openid profile email
      - --code-challenge-method=S256
      - --upstream=http://app:8080/
      - --reverse-proxy=true
      - --trusted-proxy-ip=172.18.0.0/16
      - --real-client-ip-header=X-Forwarded-For
      - --pass-user-headers=true
      - --prefer-email-to-user=false
      - --skip-provider-button=true
      - --whitelist-domain=apps.ad.itac.com.ar
      - --skip-auth-route=GET=^/activos/api/health$
      - --skip-auth-route=GET=^/activos/aceptar(?:/.*)?$
      - --skip-auth-route=GET=^/activos/assets/.*$
      - --skip-auth-route=GET=^/activos/favicon.ico$
      - --skip-auth-route=GET=^/activos/api/public/deliveries/[^/]+/acceptance$
      - --skip-auth-route=POST=^/activos/api/public/deliveries/[^/]+/acceptance$
    secrets:
      - keycloak_client_secret
      - oauth_cookie_secret
    volumes:
      - type: bind
        source: /srv/docker/apps/control-entrega-activos/certs/ad-ITAC-CA.pem
        target: /etc/ssl/certs/ad-ITAC-CA.pem
        read_only: true
    networks:
      - app-internal
      - proxy
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  import:
    profiles: ["tools"]
    image: control-entrega-activos:0.1.0
    command:
      - ./node_modules/.bin/tsx
      - scripts/import-base44-export.mjs
      - --source
      - /import
      - --dry-run
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: control_entrega_activos
      DATABASE_USER: control_activos_migrator
      DATABASE_PASSWORD_FILE: /run/secrets/db_migrator_password
    secrets:
      - db_migrator_password
    volumes:
      - type: bind
        source: /srv/docker/apps/control-entrega-activos/import
        target: /import
        read_only: true
    networks:
      - db-internal
    restart: "no"

  ocs-sync:
    profiles: ["tools"]
    image: control-entrega-activos:0.1.0
    command: ["./node_modules/.bin/tsx", "scripts/run-ocs-sync.mjs"]
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: control_entrega_activos
      DATABASE_USER: control_activos_app
      DATABASE_PASSWORD_FILE: /run/secrets/db_app_password
      TZ: America/Argentina/Buenos_Aires
      OCS_BASE_URL: http://inventario.ad.itac.com.ar/ocsapi/v1
      OCS_WARNING_HOURS: "24"
      OCS_CRITICAL_DAYS: "7"
      OCS_REPORT_DAYS: "30"
      OCS_TIMEOUT_MS: "20000"
      OCS_CONCURRENCY: "6"
      OCS_CREATE_MISSING: "false"
      MIN_RAM_GB: "8"
      CRITICAL_RAM_GB: "4"
      RENEWAL_MIN_SCORE: "3"
    secrets:
      - db_app_password
    networks:
      - db-internal
      - ocs-egress
    restart: "no"

secrets:
  db_app_password:
    file: /srv/docker/apps/control-entrega-activos/secrets/db_app_password
  db_migrator_password:
    file: /srv/docker/apps/control-entrega-activos/secrets/db_migrator_password
  keycloak_client_secret:
    file: /srv/docker/apps/control-entrega-activos/secrets/keycloak_client_secret
  oauth_cookie_secret:
    file: /srv/docker/apps/control-entrega-activos/secrets/oauth_cookie_secret

networks:
  app-internal:
    name: control-entrega-activos-internal
    internal: true
  db-internal:
    external: true
  ocs-egress:
    name: control-entrega-activos-ocs-egress
    driver: bridge
  proxy:
    external: true
